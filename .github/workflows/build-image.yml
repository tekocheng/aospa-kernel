name: Kernel Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aospa-marble-kernel-image
  cancel-in-progress: false

env:
  CLANG_DIR: clang-r596125
  KSU_REF: dbb73665d103da40c7ecbd21ba3b5ac76eb95784
  BUILD_TYPE: kernel-image

jobs:
  build-kernel-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Setup AOSPA build environment
        uses: ./.github/actions/setup-build
        with:
          clang-dir: ${{ env.CLANG_DIR }}

      - name: Include pinned KernelSU
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_REF}/kernel/setup.sh" \
            | bash -s "${KSU_REF}"
          test -d KernelSU/kernel

      - name: Build kernel image
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          export PATH="$(realpath ../../clang/${CLANG_DIR}/bin):$PATH"
          ./build.sh marble --only-kernel
          test -s "$GITHUB_WORKSPACE/device/xiaomi/marble-kernel/Image"

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/write-build-info.sh

      - name: Upload kernel image artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kernel-image
          path: |
            device/xiaomi/marble-kernel/Image
            build-info.txt
            resolved-manifest.xml
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
