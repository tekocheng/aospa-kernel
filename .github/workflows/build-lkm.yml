name: KernelSU LKM Module

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aospa-marble-kernelsu-lkm
  cancel-in-progress: false

env:
  CLANG_DIR: clang-r596125
  KSU_REF: dbb73665d103da40c7ecbd21ba3b5ac76eb95784
  NOMOUNT_REF: bf1847f98fed382369c43bfd652cd93774b9b8e3
  BUILD_TYPE: kernelsu-lkm

jobs:
  build-ksu-lkm-module:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7.0.1

      - name: Setup AOSPA build environment
        uses: ./.github/actions/setup-build
        with:
          clang-dir: ${{ env.CLANG_DIR }}

      - name: Include pinned KernelSU
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_REF}/kernel/setup.sh" \
            | bash -s "${KSU_REF}"
          test -d KernelSU/kernel

      - name: Include pinned NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_REF}/kernel/setup.sh" \
            | bash -s "${NOMOUNT_REF}"

      - name: Build KernelSU LKM modules
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          export PATH="$(realpath ../../clang/${CLANG_DIR}/bin):$PATH"
          ./build.sh marble --only-modules
          test -s out/kernelsu.ko
          test -s out/nomount.ko
          file out/kernelsu.ko out/nomount.ko

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/write-build-info.sh

      - name: Upload KernelSU LKM artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ksu-lkm-module
          path: |
            kernel_platform/xiaomi/sm8450/out/kernelsu.ko
            kernel_platform/xiaomi/sm8450/out/nomount.ko
            build-info.txt
            resolved-manifest.xml
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
