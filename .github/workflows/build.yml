
name: Build AOSPA ShadeDark Calcite Kernel

on:
  workflow_dispatch:
    inputs:
      susfs_mode:
        description: "SUSFS integration mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - off
          - required

env:
  MANIFEST_URL: https://github.com/aospa-shadedark/kernel_manifest
  MANIFEST_BRANCH: calcite-xiaomi-sm8450
  CLANG_DIR: clang-r596125
  KSU_REF: main
  NOMOUNT_REF: v2.2.0
  SUSFS_BRANCH: gki-android12-5.10
  SUSFS_MODE: ${{ inputs.susfs_mode || 'auto' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build-kernel:
    name: Build Calcite Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Free disk space
      # --------------------------------------------------
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.2.0"
          testing: false

      - name: Check disk before build
        run: |
          echo "Disk after cleanup:"
          df -h
          echo
          echo "Memory:"
          free -h

      # --------------------------------------------------
      # 2. Swap
      # --------------------------------------------------
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Configure swappiness
        run: |
          sudo sysctl -w vm.swappiness=100
          free -h
          df -h

      # --------------------------------------------------
      # 3. Checkout workflow repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 4. Dependencies and repo tool
      # --------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            git-lfs \
            libelf-dev \
            libssl-dev \
            lz4 \
            make \
            openssl \
            python3-dev \
            python3-pip \
            rsync \
            unzip \
            zip

          sudo curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod a+rx /usr/local/bin/repo

          repo version
          ccache --version

      # --------------------------------------------------
      # 5. Initialize ShadeDark manifest
      # --------------------------------------------------
      - name: Initialize manifest
        run: |
          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1

      # --------------------------------------------------
      # 6. Add marble kernel device project
      # --------------------------------------------------
      - name: Add local manifest
        run: |
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/marble.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote
              name="github-local"
              fetch="https://github.com/" />

            <project
              name="aospa-shadedark/android_device_xiaomi_marble-kernel"
              path="device/xiaomi/marble-kernel"
              remote="github-local"
              revision="calcite" />
          </manifest>
          EOF

          cat .repo/local_manifests/marble.xml

      # --------------------------------------------------
      # 7. Sync source
      # --------------------------------------------------
      - name: Sync source
        run: |
          repo sync \
            --current-branch \
            --no-tags \
            --no-clone-bundle \
            --fail-fast \
            -j2

          echo "Disk after repo sync:"
          df -h

          echo "Source directories:"
          ls -lah kernel_platform
          ls -lah kernel_platform/xiaomi/sm8450
          ls -lah device/xiaomi/marble-kernel

          test -f kernel_platform/xiaomi/sm8450/build.sh
          test -d device/xiaomi/marble-kernel

      # --------------------------------------------------
      # 8. Create build configuration
      # --------------------------------------------------
      - name: Configure kernel build
        run: |
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel_platform/xiaomi/sm8450"

          echo "SRC_ROOT=$GITHUB_WORKSPACE" > "$KERNEL_DIR/.build.rc"

          echo "Build configuration:"
          cat "$KERNEL_DIR/.build.rc"

          test -f "$KERNEL_DIR/build.sh"

      # --------------------------------------------------
      # 9. Cache Clang
      # --------------------------------------------------
      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: kernel_platform/clang
          key: clang-${{ env.CLANG_DIR }}-main-kernel-v1

      # --------------------------------------------------
      # 10. Sparse checkout Clang
      # --------------------------------------------------
      - name: Setup Clang
        run: |
          mkdir -p kernel_platform/clang
          cd kernel_platform/clang

          if [ ! -d "$CLANG_DIR/bin" ]; then
            echo "Clang not found in cache. Downloading sparse toolchain."

            git clone \
              -n \
              --depth=1 \
              --filter=tree:0 \
              -b main-kernel \
              --single-branch \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 .

            git sparse-checkout init --cone
            git sparse-checkout set "$CLANG_DIR"
            git checkout
          else
            echo "Using cached $CLANG_DIR"
          fi

          test -x "$CLANG_DIR/bin/clang"
          "$CLANG_DIR/bin/clang" --version

      # --------------------------------------------------
      # 11. Cache ccache
      # --------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-calcite-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-calcite-ccache-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config

      # --------------------------------------------------
      # 12. Integrate KernelSU Official
      # --------------------------------------------------
      - name: Include KernelSU Official
        run: |
          cd kernel_platform/xiaomi/sm8450

          rm -rf KernelSU KernelSU-Next

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -s "$KSU_REF"

          test -d KernelSU
          echo "KernelSU commit:"
          git -C KernelSU rev-parse HEAD

      # --------------------------------------------------
      # 13. Integrate SUSFS
      # --------------------------------------------------
      - name: Include SUSFS
        run: |
          set -e

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel_platform/xiaomi/sm8450"
          SUSFS_DIR="$RUNNER_TEMP/susfs4ksu"
          PATCH_NAME="50_add_susfs_in_gki-android12-5.10.patch"

          if [ "$SUSFS_MODE" = "off" ]; then
            echo "SUSFS integration disabled."
            exit 0
          fi

          if ! git clone \
            --depth=1 \
            --branch "$SUSFS_BRANCH" \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            "$SUSFS_DIR"; then

            if [ "$SUSFS_MODE" = "required" ]; then
              echo "::error::Unable to clone SUSFS source."
              exit 1
            fi

            echo "::warning::SUSFS source unavailable. Skipping SUSFS."
            exit 0
          fi

          PATCH="$SUSFS_DIR/kernel_patches/$PATCH_NAME"

          if [ ! -f "$PATCH" ]; then
            if [ "$SUSFS_MODE" = "required" ]; then
              echo "::error::SUSFS patch not found."
              exit 1
            fi

            echo "::warning::SUSFS patch not found. Skipping."
            exit 0
          fi

          cd "$KERNEL_DIR"

          if ! git apply --check "$PATCH"; then
            if [ "$SUSFS_MODE" = "required" ]; then
              echo "::error::SUSFS patch is incompatible with this kernel source."
              exit 1
            fi

            echo "::warning::SUSFS patch is incompatible. Skipping SUSFS."
            exit 0
          fi

          cp -af "$SUSFS_DIR/fs/." fs/
          cp -af "$SUSFS_DIR/include/linux/." include/linux/

          git apply "$PATCH"

          CONFIG_FRAGMENT="vendor/marble_GKI.config"

          if [ ! -f "$CONFIG_FRAGMENT" ]; then
            echo "::error::Missing $CONFIG_FRAGMENT"
            exit 1
          fi

          if grep -RqsE '^[[:space:]]*config KSU_SUSFS([[:space:]]|$)' \
            --include='Kconfig*' .; then

            sed -i \
              '/^CONFIG_KSU_SUSFS=/d' \
              "$CONFIG_FRAGMENT"

            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FRAGMENT"
          else
            echo "::error::SUSFS Kconfig option not found after patch."
            exit 1
          fi

          echo "SUSFS patch applied."
          echo "SUSFS commit:"
          git -C "$SUSFS_DIR" rev-parse HEAD

          echo "SUSFS_STATUS=enabled" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 14. Integrate NoMount v2.2.0
      # --------------------------------------------------
      - name: Include NoMount
        run: |
          set -e

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel_platform/xiaomi/sm8450"
          CONFIG_FRAGMENT="$KERNEL_DIR/vendor/marble_GKI.config"

          cd "$KERNEL_DIR"

          curl -fLSs \
            "https://raw.githubusercontent.com/maxsteeel/nomount/$NOMOUNT_REF/kernel/setup.sh" \
            -o "$RUNNER_TEMP/nomount-setup.sh"

          bash "$RUNNER_TEMP/nomount-setup.sh" "$NOMOUNT_REF"

          test -e fs/nomount
          test -f fs/nomount/Kconfig

          if [ ! -f "$CONFIG_FRAGMENT" ]; then
            echo "::error::Missing marble GKI config fragment."
            exit 1
          fi

          sed -i \
            -e '/^CONFIG_NOMOUNT=/d' \
            -e '/^# CONFIG_NOMOUNT is not set$/d' \
            "$CONFIG_FRAGMENT"

          echo "CONFIG_NOMOUNT=y" >> "$CONFIG_FRAGMENT"

          echo "NoMount source:"
          git -C NoMount rev-parse HEAD

          echo "NoMount config:"
          tail -n 10 "$CONFIG_FRAGMENT"

      # --------------------------------------------------
      # 15. Build kernel image
      # --------------------------------------------------
      - name: Build kernel image
        run: |
          set -e

          cd kernel_platform/xiaomi/sm8450

          CCACHE_BIN="$RUNNER_TEMP/ccache-bin"
          CLANG_BIN="$(realpath ../../clang/$CLANG_DIR/bin)"

          mkdir -p "$CCACHE_BIN"

          ln -sf "$(command -v ccache)" "$CCACHE_BIN/clang"
          ln -sf "$(command -v ccache)" "$CCACHE_BIN/clang++"

          export PATH="$CCACHE_BIN:$CLANG_BIN:$PATH"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_MAXSIZE=5G

          echo "Compiler:"
          command -v clang
          clang --version

          echo "Starting Calcite kernel build."

          ./build.sh marble --only-kernel

          echo "Build completed."

          echo "ccache statistics:"
          ccache --show-stats

      # --------------------------------------------------
      # 16. Verify build configuration and Image
      # --------------------------------------------------
      - name: Verify build output
        run: |
          set -e

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel_platform/xiaomi/sm8450"
          IMAGE="$GITHUB_WORKSPACE/device/xiaomi/marble-kernel/Image"
          CONFIG="$KERNEL_DIR/out/.config"

          test -s "$IMAGE"
          test -s "$CONFIG"

          echo "Kernel Image:"
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

          echo "KernelSU config:"
          grep -E '^CONFIG_KSU=(m|y)$' "$CONFIG"

          echo "NoMount config:"
          grep -E '^CONFIG_NOMOUNT=y$' "$CONFIG"

          if [ "$SUSFS_MODE" != "off" ] && \
             grep -q 'SUSFS_STATUS=enabled' "$GITHUB_ENV"; then
            grep -E '^CONFIG_KSU_SUSFS=y$' "$CONFIG"
          fi

      # --------------------------------------------------
      # 17. Package AnyKernel3 for marble
      # --------------------------------------------------
      - name: Package AnyKernel3
        run: |
          set -e

          IMAGE="$GITHUB_WORKSPACE/device/xiaomi/marble-kernel/Image"
          AK3_DIR="$RUNNER_TEMP/AnyKernel3"
          DIST="$GITHUB_WORKSPACE/dist"

          mkdir -p "$DIST"

          git clone \
            --depth=1 \
            --branch marble \
            https://github.com/siimsek/AnyKernel3.git \
            "$AK3_DIR"

          cp "$IMAGE" "$AK3_DIR/Image"

          python3 -m pip install --user bsdiff4

          VERSION="ShadeDark-Calcite-$(date -u +%Y%m%d-%H%M)"

          cd "$AK3_DIR"

          python3 make_package.py -s "$VERSION"

          mapfile -t PACKAGES < <(find . -maxdepth 1 -type f -name '*.zip')

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::AnyKernel3 package was not generated."
            exit 1
          fi

          for package in "${PACKAGES[@]}"; do
            cp "$package" "$DIST/"
          done

          cp "$IMAGE" "$DIST/Image"

          cd "$DIST"
          sha256sum Image *.zip > SHA256SUMS.txt

          echo "Generated packages:"
          ls -lh

      # --------------------------------------------------
      # 18. Upload artifacts
      # --------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShadeDark-Calcite-Kernel
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
          
