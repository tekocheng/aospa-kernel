name: AOSPA Kernel Build Setup
description: Prepare the GitHub-hosted runner, sync AOSPA sources, and cache the Clang toolchain.

inputs:
  clang-dir:
    description: Clang toolchain directory to use
    required: false
    default: clang-r596125
  source-branch:
    description: AOSPA Marble kernel and device source branch
    required: false
    default: beryl

runs:
  using: composite
  steps:
    - name: Free disk space
      uses: endersonmenezes/free-disk-space@main
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: false
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.2.0"
        testing: false

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Tune memory pressure
      shell: bash
      run: sudo sysctl -w vm.swappiness=100

    - name: Setup Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.12"

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y bc device-tree-compiler
        sudo curl --fail --location --retry 5 --retry-all-errors \
          https://storage.googleapis.com/git-repo-downloads/repo \
          --output /usr/local/bin/repo
        sudo chmod 0755 /usr/local/bin/repo
        repo version

    - name: Initialize and sync AOSPA sources
      shell: bash
      env:
        SOURCE_BRANCH: ${{ inputs.source-branch }}
      run: |
        set -euo pipefail
        case "$SOURCE_BRANCH" in
          beryl|vauxite) ;;
          *) echo "Unsupported source branch: $SOURCE_BRANCH" >&2; exit 1 ;;
        esac
        sed -i -E \\
          "s|(name=\"aospa-shadedark/android_kernel_xiaomi_sm8450\" path=\"kernel_platform/xiaomi/sm8450\" revision=\")[^\"]+(\")|\\1${SOURCE_BRANCH}\\2|; \\
           s|(name=\"aospa-shadedark/android_device_xiaomi_marble-kernel\" path=\"device/xiaomi/marble-kernel\" revision=\")[^\"]+(\")|\\1${SOURCE_BRANCH}\\2|" \\
          manifest.xml
        repo init -u https://github.com/tekocheng/aospa-kernel -b main -m manifest.xml --depth=1
        repo sync --fail-fast -j8
        test -d kernel_platform/xiaomi/sm8450
        cp -rvf android_kernel_xiaomi_sm8450/. kernel_platform/xiaomi/sm8450/
        sed -i "s/^KERNEL_NAME=.*/KERNEL_NAME=\"${SOURCE_BRANCH}\"/" kernel_platform/xiaomi/sm8450/build.sh
        sed -i 's/\r$//' kernel_platform/xiaomi/sm8450/scripts/setlocalversion
        mkdir -p device/xiaomi/marble-kernel/dtbs
        printf 'SRC_ROOT=%s\n' "$GITHUB_WORKSPACE" > kernel_platform/xiaomi/sm8450/.build.rc

    - name: Cache Clang toolchain
      uses: actions/cache@v6.1.0
      with:
        path: kernel_platform/clang
        key: ${{ runner.os }}-clang-${{ inputs['clang-dir'] }}
        restore-keys: |
          ${{ runner.os }}-clang-${{ inputs['clang-dir'] }}-

    - name: Setup Clang
      shell: bash
      env:
        CLANG_DIR: ${{ inputs['clang-dir'] }}
      run: |
        set -euo pipefail
        mkdir -p kernel_platform/clang
        cd kernel_platform/clang
        if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
          echo "Clang cache miss; fetching ${CLANG_DIR}"
          git clone -n --depth=1 --filter=tree:0 -b main-kernel --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 .
          git sparse-checkout init --cone
          git sparse-checkout set "${CLANG_DIR}"
          git checkout
        fi
        test -x "${CLANG_DIR}/bin/clang"
        "${CLANG_DIR}/bin/clang" --version
